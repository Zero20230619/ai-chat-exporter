<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>思考过程兜底 - DeepSeek</title>
</head>
<body>
  <div class="ds-virtual-list-items">
    <div data-virtual-list-item-key="1">
      <div class="ds-message">
        <div class="fbb737a4">
          <div class="ds-collapsible-text"><div><span>先停一下，我整理一下思路。</span></div></div>
        </div>
      </div>
    </div>
    <div data-virtual-list-item-key="2">
      <!-- 模拟“已停止”的消息：只有思考过程，没有最终正文 -->
      <div class="ds-message">
        <div class="ds-think-content">
          <div class="ds-markdown">
            <p>用户要求停止，我需要保留已经整理好的思路。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../src/extractor.js"></script>
  <script src="harness.js"></script>
</body>
</html>
